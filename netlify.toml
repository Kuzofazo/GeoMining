# =====================================================
# GeoMining EC — Netlify Configuration
# =====================================================

# -------------------------------------------------------
# Hashed Vite assets: immutable 1-year cache
# -------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# -------------------------------------------------------
# Service Worker: NEVER cache
# The browser must always fetch the latest sw.js to
# trigger its native update algorithm and detect new builds.
# -------------------------------------------------------
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma        = "no-cache"
    Service-Worker-Allowed = "/"

# -------------------------------------------------------
# Version manifest: NEVER cache
# The client polls this file to detect new deployments.
# -------------------------------------------------------
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma        = "no-cache"

# -------------------------------------------------------
# PWA Manifest: no-cache
# -------------------------------------------------------
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma        = "no-cache"

# -------------------------------------------------------
# HTML & root: always fetch fresh
# -------------------------------------------------------
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma        = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma        = "no-cache"

# -------------------------------------------------------
# Security headers (all routes)
# -------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "SAMEORIGIN"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# -------------------------------------------------------
# SPA Routing
# -------------------------------------------------------

# Serve /Present/* files directly (no SPA rewrite)
[[redirects]]
  from   = "/Present/*"
  to     = "/Present/:splat"
  status = 200

# All other routes → React SPA
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
